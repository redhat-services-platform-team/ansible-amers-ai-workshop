name: Workshop docs

on:
  push:
    branches-ignore: [gh-pages]
  pull_request:
    branches: [main]
  delete:
  workflow_dispatch:

permissions:
  contents: read

# Keep the read/update/deploy cycle atomic across branches. Queue all updates.
concurrency:
  group: github-pages
  queue: max

jobs:
  publish:
    if: >-
      github.ref != 'refs/heads/gh-pages' &&
      (github.event_name != 'delete' ||
       (github.event.ref_type == 'branch' && github.event.ref != 'gh-pages'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        if: github.event_name != 'delete'
        with:
          ruby-version: '3.3'
      - name: Install Asciidoctor
        if: github.event_name != 'delete'
        run: gem install asciidoctor -v 2.0.23 --no-document
      - name: Build documentation
        if: github.event_name != 'delete'
        run: ruby docs/build.rb
      - name: Check generated pages and links
        if: github.event_name != 'delete'
        run: python3 docs/check.py
      - name: Test branch publication
        run: python3 docs/test_publish.py
      - name: Update combined site
        if: github.event_name != 'pull_request'
        env:
          PAGES_BRANCH: ${{ github.event_name == 'delete' && github.event.ref || github.ref_name }}
          PAGES_DELETE: ${{ github.event_name == 'delete' }}
        run: python3 docs/publish.py
      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
