name: Workshop docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Install Asciidoctor
        run: gem install asciidoctor -v 2.0.23 --no-document
      - name: Build documentation
        run: ruby docs/build.rb
      - name: Check generated pages and links
        run: python3 docs/check.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: www

  deploy:
    # PRs and manual runs on other branches build artifacts without publishing.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
