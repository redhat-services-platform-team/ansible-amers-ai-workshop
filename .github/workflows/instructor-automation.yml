name: Instructor automation checks

on:
  pull_request:
    paths:
      - instructor_automation/**
      - .github/workflows/instructor-automation.yml
  push:
    branches: [main]
    paths:
      - instructor_automation/**
      - .github/workflows/instructor-automation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: instructor_automation
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            instructor_automation/requirements.txt
            instructor_automation/requirements-dev.txt
      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install AWS collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: Install the pinned Gitea role
        run: ansible-galaxy role install -r requirements.yml -p external_roles
      - name: Check playbook syntax
        run: ansible-playbook site.yml --syntax-check -e @environments.example.yml
      - name: Lint the role
        run: ansible-lint --offline site.yml roles/workshop_git tests
      - name: Test discovery and credential handling
        run: ansible-playbook tests/validate.yml
