---
- name: Verify Ansible Development Tools container from Cursor
  hosts: localhost
  gather_facts: true
  tasks:
    - name: Print a hello message from the containerized runtime
      ansible.builtin.debug:
        msg: >-
          Hello from Accelerating Ansible Delivery with AI.
          Ansible {{ ansible_version.full }} is running inside the
          community-ansible-dev-tools container via Podman.

    - name: Confirm we are executing inside a Linux container-friendly host
      ansible.builtin.assert:
        that:
          - ansible_system == "Linux" or ansible_connection == "local"
        success_msg: Runtime check passed for Lab 1.
        fail_msg: Unexpected runtime; ensure you launched ansible-playbook inside the ADT container.
