---
- name: teardown | Validate deployment identifiers
  ansible.builtin.assert:
    that:
      - workshop_git_deployment_id is match('^[a-z][a-z0-9-]{0,23}$')
      - workshop_git_dns_label is match('^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$')
      - workshop_git_aws_account.name is match('^[a-z][a-z0-9-]{0,23}$')
      - workshop_git_aws_account.region is match('^[a-z]{2}(?:-[a-z]+)+-[0-9]+$')
      - workshop_git_aws_account.access_key | length > 0
      - workshop_git_aws_account.secret_key | length > 0
  no_log: true

- name: teardown | Discover deployment and check DNS ownership
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/discover_shared.yml"

- name: teardown | Discover and remove owned AWS resources
  no_log: true
  module_defaults:
    group/amazon.aws.aws:
      access_key: "{{ workshop_git_aws_account.access_key }}"
      secret_key: "{{ workshop_git_aws_account.secret_key }}"
      session_token: "{{ workshop_git_aws_account.session_token | default(omit, true) }}"
      aws_region: "{{ workshop_git_aws_account.region }}"
  block:
    - name: teardown | Select ownership tags
      ansible.builtin.set_fact:
        __workshop_git_teardown_tags:
          WorkshopDeployment: "{{ workshop_git_deployment_id }}"
          WorkshopEnvironment: "{{ workshop_git_aws_account.name }}"
          WorkshopGitFQDN: "{{ __workshop_git_plan.fqdn }}"
          ManagedBy: "{{ __workshop_git_managed_by }}"

    - name: teardown | Find deployment instances
      amazon.aws.ec2_instance_info:
        filters:
          tag:Name: "{{ __workshop_git_plan.resource_name }}"
          tag:WorkshopDeployment: "{{ workshop_git_deployment_id }}"
          instance-state-name: [pending, running, stopping, stopped, shutting-down]
      register: __workshop_git_teardown_instances

    - name: teardown | Find the dedicated VPC
      amazon.aws.ec2_vpc_net_info:
        filters:
          tag:Name: "{{ __workshop_git_plan.resource_name }}"
          tag:WorkshopDeployment: "{{ workshop_git_deployment_id }}"
      register: __workshop_git_teardown_vpcs

    - name: teardown | Find the deployment SSH key pair
      amazon.aws.ec2_key_info:
        filters:
          key-name: "{{ __workshop_git_plan.resource_name }}"
      register: __workshop_git_teardown_keys

    - name: teardown | Reject ambiguous resources
      ansible.builtin.assert:
        that:
          - __workshop_git_teardown_instances.instances | length <= 1
          - __workshop_git_teardown_vpcs.vpcs | length <= 1

    - name: teardown | Discover dedicated VPC contents
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/teardown_network_info.yml"
      loop: "{{ __workshop_git_teardown_vpcs.vpcs }}"
      loop_control:
        loop_var: __workshop_git_teardown_vpc

    - name: teardown | Verify resource and DNS ownership before deleting anything
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/teardown_ownership.yml"
      vars:
        __workshop_git_teardown_resources: >-
          {{ __workshop_git_teardown_instances.instances + __workshop_git_teardown_vpcs.vpcs +
             __workshop_git_teardown_keys.keypairs +
             (__workshop_git_teardown_subnets.subnets | default([])) +
             (__workshop_git_teardown_custom_routes | default([])) +
             (__workshop_git_teardown_gateways.internet_gateways | default([])) +
             (__workshop_git_teardown_groups.security_groups | default([]) | rejectattr('group_name', 'equalto', 'default') | list) +
             (__workshop_git_teardown_vpc_instances.instances | default([])) }}

    - name: teardown | Remove the Git A record using its discovered value
      amazon.aws.route53:
        hosted_zone_id: "{{ __workshop_git_plan.zone_id }}"
        record: "{{ __workshop_git_plan.fqdn }}"
        type: A
        value: "{{ item.resource_records | map(attribute='value') | list }}"
        ttl: "{{ item.ttl }}"
        state: absent
        wait: true
      loop: "{{ __workshop_git_dns_records }}"

    - name: teardown | Terminate the Git instance and its root volume
      amazon.aws.ec2_instance:
        instance_ids: "{{ __workshop_git_teardown_instances.instances | map(attribute='instance_id') | list }}"
        state: absent
        wait: true
      when: __workshop_git_teardown_instances.instances | length > 0

    - name: teardown | Remove dedicated VPC resources
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/teardown_network.yml"
      loop: "{{ __workshop_git_teardown_vpcs.vpcs }}"
      loop_control:
        loop_var: __workshop_git_teardown_vpc

    - name: teardown | Remove the AWS SSH key pair
      amazon.aws.ec2_key:
        name: "{{ item.key_name }}"
        state: absent
      loop: "{{ __workshop_git_teardown_keys.keypairs }}"

    - name: teardown | Release the DNS ownership marker after AWS cleanup
      amazon.aws.route53:
        hosted_zone_id: "{{ __workshop_git_plan.zone_id }}"
        record: "_workshop-owner.{{ __workshop_git_plan.fqdn }}"
        type: TXT
        value: "{{ item.resource_records | map(attribute='value') | list }}"
        ttl: "{{ item.ttl }}"
        state: absent
        wait: true
      loop: "{{ __workshop_git_owner_records }}"

- name: teardown | Remove the generated inventory containing AWS credentials
  ansible.builtin.file:
    path: "{{ playbook_dir }}/inventory/workshop.aws_ec2.yml"
    state: absent
