---
- name: configure | Wait for SSH access
  ansible.builtin.wait_for_connection:
    timeout: "{{ workshop_git_timeout }}"

- name: configure | Gather server facts
  ansible.builtin.setup:

- name: configure | Install ACL support for the Gitea service user
  ansible.builtin.apt:
    name: acl
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

- name: configure | Check for an existing native Gitea installation
  ansible.builtin.stat:
    path: "{{ __workshop_git_installation_path }}"
  loop:
    - /usr/local/bin/gitea
    - /etc/gitea/gitea.ini
    - /var/lib/gitea/data/gitea.db
  loop_control:
    loop_var: __workshop_git_installation_path
  register: __workshop_git_installation

- name: configure | Read existing local users before generating passwords
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/read_users.yml"
  when: __workshop_git_installation.results | map(attribute='stat.exists') | select('equalto', true) | list | length == 3

- name: configure | Load controller account state
  ansible.builtin.set_fact:
    __workshop_git_student_ids: "{{ hostvars[workshop_git_controller].__workshop_git_student_ids }}"
    __workshop_git_passwords: "{{ hostvars[workshop_git_controller].__workshop_git_passwords }}"
    __workshop_git_teams: "{{ hostvars[workshop_git_controller].__workshop_git_teams }}"
  no_log: true

- name: configure | Refuse to replace missing saved passwords
  ansible.builtin.assert:
    that:
      - >-
        (__workshop_git_existing_usernames | default([])) | intersect(
        (__workshop_git_student_ids + [workshop_git_admin_user]) | map('lower') | list)
        | difference(__workshop_git_passwords.keys() | map('lower') | list) | length == 0
    fail_msg: Restore the saved password file before configuring existing workshop users.
  no_log: true

- name: configure | Generate passwords only for new accounts
  ansible.builtin.set_fact:
    __workshop_git_passwords: >-
      {{ __workshop_git_passwords | combine({__workshop_git_username | lower:
      'Aa1!' ~ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits'])}) }}
  loop: "{{ __workshop_git_student_ids + [workshop_git_admin_user] }}"
  loop_control:
    loop_var: __workshop_git_username
  when: __workshop_git_username | lower not in __workshop_git_passwords.keys() | map('lower') | list
  no_log: true

- name: configure | Save passwords before creating accounts
  ansible.builtin.copy:
    dest: "{{ workshop_git_password_file }}"
    content: "{{ __workshop_git_passwords | to_nice_json }}"
    mode: '0600'
  delegate_to: "{{ workshop_git_controller }}"
  no_log: true

- name: configure | Install Gitea with the pinned upstream role
  ansible.builtin.include_role:
    name: roles-ansible.gitea
    apply:
      no_log: true
  vars:
    # Define optional fork defaults for the upstream role's vars lookup on Ansible 2.19+.
    gitea_theme_default: gitea-auto
    gitea_themes: gitea-auto,gitea-light,gitea-dark
    gitea_gpg_local_key: ''
    gitea_version: "{{ workshop_git_gitea_version }}"
    gitea_fqdn: "{{ workshop_git_server.fqdn }}"
    gitea_root_url: "{{ workshop_git_server.url }}/"
    gitea_protocol: https
    gitea_http_listen: 0.0.0.0
    gitea_http_port: '443'
    gitea_start_ssh: false
    gitea_server_extra_config: 'DISABLE_SSH = true'
    gitea_redirect_other_port: true
    gitea_port_to_redirect: '80'
    gitea_enable_acme: true
    gitea_acme_accepttos: true
    gitea_acme_email: "{{ workshop_git_acme_email }}"
    gitea_acme_directory: /var/lib/gitea/custom/https
    gitea_systemd_cap_net_bind_service: true
    gitea_disable_registration: true
    gitea_show_registration_button: false
    gitea_require_signin: true
    gitea_db_type: sqlite3
    gitea_users: []

- name: configure | Apply Gitea service changes
  ansible.builtin.meta: flush_handlers

- name: configure | Check trusted HTTPS from the instructor controller
  ansible.builtin.uri:
    url: "{{ workshop_git_server.url }}/api/healthz"
    status_code: 200
    validate_certs: true
  delegate_to: "{{ workshop_git_controller }}"
  register: __workshop_git_https
  retries: 40
  delay: 15
  until: __workshop_git_https is succeeded

- name: configure | Read local users after installing Gitea
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/read_users.yml"

- name: configure | Prepare missing local accounts for the upstream role
  ansible.builtin.set_fact:
    __workshop_git_users: >-
      {{ (__workshop_git_users | default([])) + [{'name': __workshop_git_username,
      'email': __workshop_git_username ~ '@' ~ workshop_git_server.fqdn,
      'password': __workshop_git_passwords[__workshop_git_username | lower],
      'admin': __workshop_git_username == workshop_git_admin_user,
      'must_change_password': workshop_git_must_change_password | bool
      if __workshop_git_username != workshop_git_admin_user else false}] }}
  loop: "{{ __workshop_git_student_ids + [workshop_git_admin_user] }}"
  loop_control:
    loop_var: __workshop_git_username
  when: __workshop_git_username | lower not in __workshop_git_existing_usernames
  no_log: true

- name: configure | Create local accounts with the Gitea role
  ansible.builtin.include_role:
    name: roles-ansible.gitea
    tasks_from: local_git_users
    apply:
      no_log: true
  vars:
    gitea_users: "{{ __workshop_git_users | default([]) }}"

- name: configure | Verify the upstream role created every requested user
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/read_users.yml"

- name: configure | Require exact local usernames
  ansible.builtin.assert:
    that:
      - >-
        (__workshop_git_student_ids + [workshop_git_admin_user]) | map('lower')
        | difference(__workshop_git_existing_usernames) | length == 0
    fail_msg: The upstream role skipped a username. Check for a substring collision with an existing account.

- name: configure | Manage organization permissions through the Gitea API
  delegate_to: "{{ workshop_git_controller }}"
  module_defaults:
    ansible.builtin.uri:
      url_username: "{{ workshop_git_admin_user }}"
      url_password: "{{ __workshop_git_passwords[workshop_git_admin_user | lower] }}"
      force_basic_auth: true
      validate_certs: true
      body_format: json
  no_log: true
  block:
    - name: configure | Revoke student site administrator access
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/student_permissions.yml"
      loop: "{{ __workshop_git_student_ids }}"
      loop_control:
        loop_var: __workshop_git_student

    - name: configure | Configure each named organization and group
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/team.yml"
      loop: "{{ __workshop_git_teams }}"
      loop_control:
        loop_var: __workshop_git_team

- name: configure | Save verified server details
  ansible.builtin.set_fact:
    __workshop_git_server_result: "{{ workshop_git_server }}"
