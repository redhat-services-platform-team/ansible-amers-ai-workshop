---
- name: discover | Read shared deployment and DNS ownership
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/discover_shared.yml"

- name: discover | Read the account and deployment state
  no_log: true
  module_defaults:
    group/amazon.aws.aws:
      access_key: "{{ workshop_git_aws_account.access_key }}"
      secret_key: "{{ workshop_git_aws_account.secret_key }}"
      session_token: "{{ workshop_git_aws_account.session_token | default(omit, true) }}"
      aws_region: "{{ workshop_git_aws_account.region }}"
  block:
    - name: discover | Find Red Hat RHEL 9 images
      amazon.aws.ec2_ami_info:
        owners: ['309956199498']
        filters:
          name: RHEL-9.*_HVM-*-x86_64-*-Hourly2-GP*
          state: available
          architecture: x86_64
          virtualization-type: hvm
          root-device-type: ebs
      register: __workshop_git_images

    - name: discover | Require an available RHEL 9 image
      ansible.builtin.assert:
        that: __workshop_git_images.images | length > 0

    - name: discover | Select the RHEL image for provisioning
      ansible.builtin.set_fact:
        __workshop_git_plan: >-
          {{ __workshop_git_plan | combine({
             'ami_id': (__workshop_git_images.images | sort(attribute='creation_date') | last).image_id,
             'root_device_name': (__workshop_git_images.images | sort(attribute='creation_date') | last).root_device_name}) }}

    - name: discover | Read existing instance metadata
      amazon.aws.ec2_instance_info:
        filters:
          tag:Name: "{{ __workshop_git_plan.resource_name }}"
          tag:WorkshopDeployment: "{{ workshop_git_deployment_id }}"
          instance-state-name: [pending, running, stopping, stopped]
      register: __workshop_git_existing_instances

    - name: discover | Reject duplicate instances
      ansible.builtin.assert:
        that: __workshop_git_existing_instances.instances | length <= 1
        fail_msg: Multiple instances match this deployment. Resolve duplicate tags before rerunning.

    - name: discover | Read the existing instance image
      amazon.aws.ec2_ami_info:
        image_ids: "{{ __workshop_git_existing_instances.instances | map(attribute='image_id') | list }}"
      register: __workshop_git_existing_images
      when: __workshop_git_existing_instances.instances | length > 0

- name: discover | Refuse to reuse an instance running another operating system
  ansible.builtin.assert:
    that:
      - __workshop_git_existing_images.images | length == 1
      - __workshop_git_existing_images.images[0].owner_id == '309956199498'
      - __workshop_git_existing_images.images[0].name is match('^RHEL-9[.]')
    fail_msg: Preserve the existing server. Use a new deployment ID and DNS label for a RHEL deployment.
  when: __workshop_git_existing_instances.instances | length > 0
