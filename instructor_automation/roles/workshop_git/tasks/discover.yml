---
- name: Discover the public DNS zone and Amazon Linux image
  workshop_git_discovery:
    access_key: "{{ git_env.access_key }}"
    secret_key: "{{ git_env.secret_key }}"
    session_token: "{{ git_env.session_token | default('') }}"
    region: "{{ git_env.region }}"
    hosted_zone_id: "{{ git_env.hosted_zone_id | default('') }}"
    hosted_zone_name: "{{ git_env.hosted_zone_name | default('') }}"
    dns_label: "{{ git_env.dns_label | default(workshop_git_dns_label) }}"
    environment_name: "{{ git_env.name }}"
    deployment_id: "{{ workshop_git_deployment_id }}"
    resource_name: "{{ workshop_git_deployment_id }}-{{ git_env.name }}-git"
  register: workshop_git_discovery

- name: Add this environment to the plan
  ansible.builtin.set_fact:
    workshop_git_plan: >-
      {{ workshop_git_plan + [
        {'name': git_env.name, 'environment': git_env,
         'resource_name': workshop_git_deployment_id ~ '-' ~ git_env.name ~ '-git',
         'fqdn': (git_env.dns_label | default(workshop_git_dns_label)) ~ '.' ~ workshop_git_discovery.zone_name,
         'url': 'https://' ~ (git_env.dns_label | default(workshop_git_dns_label)) ~ '.' ~ workshop_git_discovery.zone_name,
         'zone_id': workshop_git_discovery.zone_id, 'ami_id': workshop_git_discovery.ami_id,
         'account_id': workshop_git_discovery.account_id, 'partition': workshop_git_discovery.partition,
         'instance_ids': workshop_git_discovery.instance_ids}
      ] }}
  no_log: true

- name: Reject two environments targeting the same Git hostname
  ansible.builtin.assert:
    that:
      - workshop_git_plan | map(attribute='fqdn') | unique | length == workshop_git_plan | length
    fail_msg: Each environment needs its own DNS name. Use different dns_label values when sharing a zone.
