---
- name: password_state | Check the private password file
  ansible.builtin.stat:
    path: "{{ workshop_git_password_file }}"
    follow: false
  register: __workshop_git_password_state

- name: password_state | Reject a symlink or non-file password state
  ansible.builtin.assert:
    that:
      - not (__workshop_git_password_state.stat.islnk | default(false))
      - not __workshop_git_password_state.stat.exists or __workshop_git_password_state.stat.isreg
    fail_msg: The password state must be a regular file, not a symbolic link.

- name: password_state | Read saved initial passwords
  ansible.builtin.slurp:
    src: "{{ workshop_git_password_file }}"
  register: __workshop_git_password_content
  when: __workshop_git_password_state.stat.exists
  no_log: true

- name: password_state | Load saved passwords or an empty state
  ansible.builtin.set_fact:
    __workshop_git_passwords: >-
      {{ (__workshop_git_password_content.content | b64decode | from_json)
         if __workshop_git_password_state.stat.exists else {} }}
  no_log: true

- name: password_state | Validate saved password structure
  ansible.builtin.assert:
    that:
      - __workshop_git_passwords is mapping
      - __workshop_git_passwords.keys() | map('lower') | unique | length == __workshop_git_passwords | length
    fail_msg: Restore a valid password state file before rerunning.
  no_log: true

- name: password_state | Check each retained password
  ansible.builtin.assert:
    that:
      - __workshop_git_saved_password.value is string
      - __workshop_git_saved_password.value | length >= 20
      - __workshop_git_saved_password.key is match('^[A-Za-z0-9]+(?:[._-][A-Za-z0-9]+)*$')
  loop: "{{ __workshop_git_passwords | dict2items }}"
  loop_control:
    loop_var: __workshop_git_saved_password
  no_log: true

- name: password_state | Normalize saved usernames for case-insensitive matching
  ansible.builtin.set_fact:
    __workshop_git_normalized_passwords: >-
      {{ (__workshop_git_normalized_passwords | default({})) |
      combine({__workshop_git_saved_password.key | lower: __workshop_git_saved_password.value}) }}
  loop: "{{ __workshop_git_passwords | dict2items }}"
  loop_control:
    loop_var: __workshop_git_saved_password
  no_log: true

- name: password_state | Use normalized password state
  ansible.builtin.set_fact:
    __workshop_git_passwords: "{{ __workshop_git_normalized_passwords | default({}) }}"
  no_log: true
