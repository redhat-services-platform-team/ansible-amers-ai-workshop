---
- name: Test team inputs and saved credential handling without AWS
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    workshop_git_aws_account:
      name: test
      region: us-east-2
      access_key: test-access
      secret_key: test-secret
    workshop_git_teams:
      platform: [Alice, Bob]
      application: [Carol]
      network: []
      operations: [Dave]
      database: [Eve]
  tasks:
    - name: Validate five teams including an empty roster
      ansible.builtin.include_role:
        name: workshop_git
        tasks_from: validate

    - name: Check organization names and derived student IDs
      ansible.builtin.assert:
        that:
          - __workshop_git_teams | length == 5
          - __workshop_git_student_ids | sort == ['Alice', 'Bob', 'Carol', 'Dave', 'Eve']

    - name: Validate one team
      ansible.builtin.include_role:
        name: workshop_git
        tasks_from: validate
      vars:
        workshop_git_teams:
          solo: [onlystudent]

    - name: Reject invalid rosters and name collisions
      ansible.builtin.include_tasks: reject.yml
      loop:
        - {}
        - platform: [Alice]
          application: [alice]
        - platform: Alice
        - platform: {Alice: Bob}
        - platform: [platform]
        - Owners: [Alice]
        - platform: [instructor]
        - platform: [123]
      loop_control:
        loop_var: rejected_teams

    - name: Create an isolated password state directory
      ansible.builtin.tempfile:
        state: directory
      register: test_private

    - name: Check password state preservation
      block:
        - name: Write saved mixed-case account state
          ansible.builtin.copy:
            dest: "{{ test_private.path }}/passwords.json"
            content: '{"Alice": "Aa1!saved-password-long-enough"}'
            mode: '0600'

        - name: Read and validate saved credentials
          ansible.builtin.include_role:
            name: workshop_git
            tasks_from: password_state
          vars:
            workshop_git_password_file: "{{ test_private.path }}/passwords.json"

        - name: Require case-insensitive matching without password changes
          ansible.builtin.assert:
            that:
              - __workshop_git_passwords == {'alice':'Aa1!saved-password-long-enough'}

        - name: Render an isolated EC2 inventory configuration
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/workshop_git/templates/workshop.aws_ec2.yml.j2"
            dest: "{{ test_private.path }}/workshop.aws_ec2.yml"
            mode: '0600'
          vars:
            __workshop_git_plan:
              resource_name: ai-workshop-test-git
              account_id: '123456789012'
            __workshop_git_managed_by: ansible-workshop-git
            workshop_git_deployment_id: ai-workshop
            workshop_git_private_dir: "{{ test_private.path }}"
            workshop_git_ssh_private_key_file: "{{ test_private.path }}/test-key"
          no_log: true

        - name: Read the rendered inventory configuration
          ansible.builtin.slurp:
            src: "{{ test_private.path }}/workshop.aws_ec2.yml"
          register: test_inventory_content
          no_log: true

        - name: Decode the inventory source
          ansible.builtin.set_fact:
            test_inventory: "{{ test_inventory_content.content | b64decode | from_yaml }}"
          no_log: true

        - name: Require scoped EC2 discovery and the RHEL SSH account
          ansible.builtin.assert:
            that:
              - test_inventory.plugin == 'amazon.aws.aws_ec2'
              - test_inventory.filters['tag:Name'] == 'ai-workshop-test-git'
              - test_inventory.filters['tag:WorkshopDeployment'] == 'ai-workshop'
              - test_inventory.filters['tag:ManagedBy'] == 'ansible-workshop-git'
              - test_inventory.filters['instance-state-name'] == 'running'
              - test_inventory.hostnames == ['instance-id']
              - test_inventory.compose.ansible_user == "'ec2-user'"
              - test_inventory.strict and not test_inventory.cache
      always:
        - name: Delete isolated test state
          ansible.builtin.file:
            path: "{{ test_private.path }}"
            state: absent
