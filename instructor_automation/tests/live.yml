---
- name: Verify deployed Gitea organizations and repository access
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load the private access sheet
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../private/git-access.json"
      register: access_sheet
      no_log: true

    - name: Decode deployment details
      ansible.builtin.set_fact:
        live_access: "{{ access_sheet.content | b64decode | from_json }}"
      no_log: true

    - name: Generate a temporary access probe
      ansible.builtin.set_fact:
        live_probe_user: "workshop-check-{{ lookup('ansible.builtin.password', '/dev/null', length=10, chars=['ascii_lowercase', 'digits']) }}"
        live_probe_password: "Aa1!{{ lookup('ansible.builtin.password', '/dev/null', length=32, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: Authenticate API verification as the instructor
      no_log: true
      module_defaults:
        ansible.builtin.uri:
          url_username: "{{ live_access.instructor_user }}"
          url_password: "{{ live_access.initial_passwords[live_access.instructor_user | lower] }}"
          force_basic_auth: true
          validate_certs: true
          body_format: json
      block:
        - name: Create a temporary regular user for real access checks
          ansible.builtin.uri:
            url: "{{ live_access.server.url }}/api/v1/admin/users"
            method: POST
            status_code: 201
            body:
              username: "{{ live_probe_user }}"
              email: "{{ live_probe_user }}@{{ live_access.server.fqdn }}"
              password: "{{ live_probe_password }}"
              must_change_password: false
              send_notify: false

        - name: Verify organizations with temporary access
          block:
            - name: Verify each organization's roster and permissions
              ansible.builtin.include_tasks: live_team.yml
              loop: "{{ live_access.teams | dict2items }}"
              loop_control:
                loop_var: live_team
          always:
            - name: Delete the temporary probe user
              ansible.builtin.uri:
                url: "{{ live_access.server.url }}/api/v1/admin/users/{{ live_probe_user }}"
                method: DELETE
                status_code: 204
