---
# Copy into private/ and use Ansible Vault if you store credentials in this file.
workshop_git_aws_account:
  name: demo-a
  region: us-east-2
  access_key: "{{ lookup('ansible.builtin.env', 'AWS_ACCESS_KEY_ID') }}"
  secret_key: "{{ lookup('ansible.builtin.env', 'AWS_SECRET_ACCESS_KEY') }}"

# Server hostname is git.<discovered Route 53 zone>. Change this prefix if needed.
workshop_git_dns_label: git

# Each key creates an organization and a permission group with the same name.
# Add or remove entries to match your class. Each student belongs to one team.
workshop_git_teams:
  Skynet: [student1, student2, student3, student4]
  Ultron: [student5, student6, student7, student8]
  WOPR: [student9, student10, student11, student12]
  VIKI: [student13, student14, student15, student16]
  AUTO: [student17, student18, student19, student20]
